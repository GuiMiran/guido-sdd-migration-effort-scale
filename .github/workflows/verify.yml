name: GUIDO Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: GUIDO verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.10'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run auditor and verifier tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate JSON examples and internal document targets
        run: python scripts/verify_repository.py
