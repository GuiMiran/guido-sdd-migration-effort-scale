[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guido-sdd-auditor"
version = "0.1.0"
description = "Read-only repository evidence audit for the GUIDO Scale"
requires-python = ">=3.10"

[project.scripts]
guido = "guido_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
